<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Apply the saved palette before React paints to avoid a light flash.
      try {
        const saved = localStorage.getItem("meridian-theme");
        document.documentElement.dataset.theme = saved === "darkness" ||
          (saved !== "lightness" && matchMedia("(prefers-color-scheme: dark)").matches)
          ? "darkness" : "lightness";
      } catch { document.documentElement.dataset.theme = "lightness"; }
    </script>
    <meta
      name="description"
      content="Meridian 观澜 · 美股与加密货币市场研究工作台"
    />
    <title>Meridian 观澜 · 市场研究工作台</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
